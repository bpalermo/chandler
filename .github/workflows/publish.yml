name: publish

# main publishes snapshots under the mutable `dev` tag; a tag v<VERSION> or
# v<VERSION>-rc.<n> on a commit of main publishes that release, and creates
# its GitHub Release. Who may create such a tag, and that it can never be moved
# or deleted, is the repository's tag rulesets'.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Exchanged with Fulcio for a short-lived signing certificate. Keyless: there
  # is no private key to store or rotate.
  id-token: write

# Keyed by branch or tag, so publications are serialized. The alternative -- keying by
# commit -- lets two pushes to main publish at once, and since the `dev` tag is
# mutable, an older, slower run can finish last and leave it pointing at a stale
# commit.
#
# The cost is that GitHub keeps only one PENDING run per group: when a third
# push arrives while one is running, the queued one is cancelled and that commit
# publishes nothing. Between the two, a skipped intermediate commit is the
# better failure: it is visible as a cancelled run, and the commit that
# superseded it publishes seconds later, whereas a stale `dev` is silent and
# wrong. The newest commit always wins the tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# WHERE everything goes is one setting, bazel/registry.bzl. Bazel loads it;
# each job reads it through scripts/registry.sh into its environment
# (SERVER_IMAGE, CSI_IMAGE, PROVIDER_S3_IMAGE, PROVIDER_FILE_IMAGE, CHART_REPOSITORY,
# IMAGE_REGISTRY_HOST, ...), and scripts/check-registry-config.sh fails CI on a
# registry spelled out here.
#
# Credentials are a Quay robot account, secrets QUAY_USERNAME / QUAY_TOKEN of
# the `release` environment, which only main and v* tags can use. The robot can write the
# repositories and cannot create them: each one exists already.
#
# Third-party actions are pinned to commit SHAs, not tags. This job holds the
# registry credential and `id-token: write`, so an action that a retagged or
# compromised release swapped underneath us could push and sign an image with
# this repository's own identity. A tag is mutable; a commit SHA is not. The
# version each SHA corresponds to is in the comment beside it.
jobs:
  publish:
    # workflow_dispatch can target any branch. Without this guard a manual run
    # from a feature branch would publish under the same mutable tags and sign
    # with a certificate the verification identity below accepts, making it
    # indistinguishable from a publication from main.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.digest.outputs.server }}
      csi: ${{ steps.digest.outputs.csi }}
      provider_s3: ${{ steps.digest.outputs.provider_s3 }}
      provider_file: ${{ steps.digest.outputs.provider_file }}
      chart: ${{ steps.chart.outputs.ref }}
      chart_version: ${{ steps.check.outputs.chart_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The versions come from the tags (bazel/workspace_status.sh), and a
          # release tag is checked against main's history: both need all of it.
          fetch-depth: 0
          # checkout otherwise leaves GITHUB_TOKEN in .git/config, and this job
          # then runs Bazel, which executes build tooling from the dependency
          # graph while that token is live. Nothing after this step talks to
          # git over the network -- workspace_status.sh only reads the local
          # repository -- so the credential has no reason to persist.
          persist-credentials: false

      # Re-running an old workflow run checks that old commit out again, so it
      # would republish it and move the mutable `dev` tag backwards onto a
      # superseded commit -- the same stale tag the branch-keyed concurrency
      # above exists to prevent, reached by a different route. Publishing from
      # main is only ever correct for main's current tip.
      #
      # A release is published from its tag, which never moves, so re-running
      # one publishes the same commit again. The tag has to be on a commit of
      # main: a release is something main has been, never a side branch.
      #
      # ls-remote rather than the API: this repository is public, so the check
      # needs no token, and a token is the thing this job is careful about.
      - name: Refuse to publish a commit main is not, or has not been
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::could not read main's tip" >&2
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/heads/main)
              if [ "${tip}" != "${GITHUB_SHA}" ]; then
                echo "::error::refusing to publish ${GITHUB_SHA}: main is now ${tip}" >&2
                exit 1
              fi
              echo "publishing ${GITHUB_SHA}, which is main's tip"
              ;;
            refs/tags/v*)
              if ! git merge-base --is-ancestor "${GITHUB_SHA}" "${tip}"; then
                echo "::error::refusing to release ${GITHUB_REF_NAME}: ${GITHUB_SHA} is not a commit of main" >&2
                exit 1
              fi
              echo "releasing ${GITHUB_REF_NAME} from ${GITHUB_SHA}, a commit of main"
              ;;
            *)
              echo "::error::refusing to publish ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac

      # A release's images are tagged with it (vX.Y.Z and vX.Y.Z-<commit>)
      # instead of the mutable `dev`, which only main moves. The flags go into
      # user.bazelrc under --config=ci, so that every build, run and cquery
      # below sees one configuration and finds the same outputs.
      - name: Tag the images with the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for pkg in server csi providers/s3 providers/file; do
            echo "common:ci --//${pkg}:image_tag=${GITHUB_REF_NAME}" >> user.bazelrc
          done
          cat user.bazelrc

      # No version is pinned here: bazelisk reads .bazelversion.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Read the registry setting
        run: scripts/registry.sh >> "${GITHUB_ENV}"

      # Everything is built before any credential exists on the runner. Bazel
      # executes build tooling from the dependency graph, and a registry
      # credential sitting in ~/.docker/config.json while that runs is readable
      # by all of it. The `bazel run` steps below then only execute what this
      # step already produced.
      #
      # cosign is part of that: the release binary the rules_img_signer_cosign
      # bazel_dep pins by sha256 (//bazel/cosign), the same one
      # `bazel run //bazel/cosign` gives a workstation.
      #
      # --config=ci refuses lockfile drift. The workspace is stamped by
      # default (.bazelrc), so the chart's version is this commit's snapshot,
      # or the release the tag names.
      #
      # --output_groups=+digest: the steps below read each index's digest
      # file, which is not a default output. When the action that writes it is
      # a disk-cache hit, Bazel leaves a non-requested output in the cache and
      # the file is absent from bazel-out; asking for the group puts it there.
      # (The first publish ran on an empty cache, so everything was built
      # locally and the file happened to exist.)
      - name: Build the images, the chart and the tools
        run: |
          bazel build --config=ci --output_groups=+digest \
            //server:image_push //server:image_index \
            //csi:image_push //csi:image_index \
            //providers/s3:image_push //providers/s3:image_index \
            //providers/file:image_push //providers/file:image_index \
            //charts/stevedore:stevedore //charts/stevedore:stevedore.push_registry \
            //bazel/cosign //bazel/cosign:verify_image

      # The chart is published under its version, which must be this commit's;
      # an unstamped package (rules_helm's placeholder version) would be pushed
      # as a tag naming no commit. And the digest the chart pins for each image
      # must be the digest of the index this job is about to push -- both come
      # from the build, so this fails only if a pin ever stops being derived
      # from its image. A pin that silently is not one is worse than a failed
      # run.
      - name: Require a stamped chart that pins the images built from this commit
        id: check
        run: |
          set -euo pipefail
          chart="$(bazel cquery --config=ci //charts/stevedore:stevedore --output=files 2>/dev/null | grep -E '\.tgz$' | head -1)"
          if [ -z "${chart}" ] || [ ! -s "${chart}" ]; then
            echo "::error::could not find the chart package (${chart})" >&2
            exit 1
          fi
          # The same script that stamped the build says what it stamped; the
          # commit in it must be the one this run is publishing, and a tag run
          # must be the release the tag names. A tag that VERSION does not
          # match is a snapshot to the script, and is refused here.
          status="$(bazel/workspace_status.sh)"
          snapshot="$(sed -n 's/^STABLE_CHART_SNAPSHOT //p' <<<"${status}")"
          release="$(sed -n 's/^STABLE_RELEASE_TAG //p' <<<"${status}")"
          if [[ "${snapshot}" != *".g${GITHUB_SHA:0:12}" ]]; then
            echo "::error::the workspace status reports snapshot '${snapshot}', which is not commit ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* && "${release}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a release of VERSION $(cat VERSION) (the workspace status says '${release}')" >&2
            exit 1
          fi
          want_version="$(sed -n 's/^STABLE_CHART_VERSION //p' <<<"${status}")"
          echo "CHART_VERSION=${want_version}" >> "${GITHUB_ENV}"
          echo "chart_version=${want_version}" >> "${GITHUB_OUTPUT}"
          got_version="$(tar -xzOf "${chart}" stevedore/Chart.yaml | sed -nE 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/p')"
          if [ "${got_version}" != "${want_version}" ]; then
            echo "::error::the chart is version '${got_version}', want '${want_version}' (an unstamped build?)" >&2
            exit 1
          fi
          # Every image the chart deploys: its index label and its repository.
          pinned() {
            local label="$1" image="$2" index_file digest_file built pin
            index_file="$(bazel cquery --config=ci "${label}" --output=files 2>/dev/null | grep -E '_index\.json$' | head -1)"
            digest_file="${index_file%_index.json}_digest"
            if [ -z "${index_file}" ] || [ ! -s "${digest_file}" ]; then
              echo "::error::could not find the image index digest of ${label} (${digest_file})" >&2
              exit 1
            fi
            built="$(cat "${digest_file}")"
            if ! pin="$(scripts/chart-pin.sh "${chart}" stevedore "${image}")"; then
              echo "::error::the chart does not pin ${image} by digest" >&2
              exit 1
            fi
            if [ "${pin}" != "${built}" ]; then
              echo "::error::the chart pins ${image}@${pin}, but ${label} is ${built}" >&2
              exit 1
            fi
            echo "chart ${got_version} will pin ${image}@${built}"
          }
          pinned //csi:image_index "${CSI_IMAGE}"
          pinned //server:image_index "${SERVER_IMAGE}"
          pinned //providers/file:image_index "${PROVIDER_FILE_IMAGE}"
          pinned //providers/s3:image_index "${PROVIDER_S3_IMAGE}"

      # One login covers everything below: image_push (rules_img) and cosign
      # read the Docker config this writes. The chart push logs in on its own,
      # from HELM_REGISTRY_USERNAME/PASSWORD (see that step).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push the multi-arch images
        run: |
          set -euo pipefail
          for target in //server:image_push //csi:image_push //providers/s3:image_push //providers/file:image_push; do
            bazel run --config=ci "${target}"
          done

      # The digest comes from the build rather than from the registry. Resolving
      # it by listing tags would have to follow the registry's pagination -- a
      # freshly pushed tag is not on the first page -- and re-resolving a tag
      # reintroduces a time-of-check window against a mutable one. Bazel
      # already wrote the digest it pushed.
      - name: Record the pushed digests
        id: digest
        run: |
          set -euo pipefail
          # The digest is not a default output, so cquery does not list it.
          # It sits beside the index manifest, which is, and both come from the
          # same rule -- so derive one path from the other rather than assuming
          # a bazel-bin layout.
          record() {
            local output="$1" label="$2" image="$3" index_file digest_file digest
            index_file="$(bazel cquery --config=ci "${label}" --output=files 2>/dev/null \
              | grep -E '_index\.json$' | head -1)"
            digest_file="${index_file%_index.json}_digest"
            if [ -z "${index_file}" ] || [ ! -s "${digest_file}" ]; then
              echo "::error::could not find the image index digest of ${label} produced by the build" >&2
              exit 1
            fi
            digest="$(cat "${digest_file}")"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest ${digest} for ${label}" >&2
              exit 1
            fi
            echo "${output}=${image}@${digest}" >> "${GITHUB_OUTPUT}"
            echo "pushed ${image}@${digest}"
          }
          record server //server:image_index "${SERVER_IMAGE}"
          record csi //csi:image_index "${CSI_IMAGE}"
          record provider_s3 //providers/s3:image_index "${PROVIDER_S3_IMAGE}"
          record provider_file //providers/file:image_index "${PROVIDER_FILE_IMAGE}"

      # --recursive signs the index and every child manifest. Without it, anyone
      # pulling the amd64 or arm64 manifest by its own digest gets something
      # unsigned. Signing by digest rather than by tag avoids cosign
      # re-resolving a mutable tag to something other than what was pushed.
      #
      # The registry serves the OCI 1.1 Referrers API, so cosign 3 attaches
      # each signature as a referrer of the manifest it signs and writes no
      # tag. `bazel run` passes the environment through, so the OIDC request
      # variables `id-token: write` provides reach cosign unchanged.
      - name: Sign the images
        env:
          COSIGN_YES: "true"
          IMAGE_REFS: |
            ${{ steps.digest.outputs.server }}
            ${{ steps.digest.outputs.csi }}
            ${{ steps.digest.outputs.provider_s3 }}
            ${{ steps.digest.outputs.provider_file }}
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: |
          set -euo pipefail
          for ref in ${IMAGE_REFS}; do
            # An image keeps its digest for as long as its content does, so
            # this commit may have pushed exactly what an earlier one signed.
            # Signing it again would add one more signature to the same
            # manifests at every commit, for nothing: ask the verifier first,
            # and sign unless it accepts the index and every child. Its output
            # goes to a file, because for a new digest it reports failures that
            # are the expected answer here. The step after this one verifies
            # again, and that one counts.
            #
            # The verifier exits 1 for "not signed, or not all of it" and 2 for
            # "could not check". Only the first is a reason to sign: a registry
            # that did not answer says nothing about the signatures, and
            # signing on it would add the duplicate this step exists to avoid.
            # All of it is signed again when any of it is missing; that happens
            # only after an interrupted run, and a second signature on a
            # manifest is valid.
            rc=0
            bazel run --config=ci //bazel/cosign:verify_image -- "${ref}" >presign.log 2>&1 || rc=$?
            case "${rc}" in
              0)
                echo "${ref} is already signed by this workflow: an earlier commit published the same image"
                continue
                ;;
              1) ;;
              *)
                cat presign.log
                echo "::error::could not check whether ${ref} is already signed (exit ${rc})" >&2
                exit 1
                ;;
            esac
            bazel run --config=ci //bazel/cosign -- sign --recursive "${ref}"
          done

      # Every digest that was signed, not just the index: `cosign verify` has
      # no --recursive to match `cosign sign --recursive`, so the verifier
      # walks each index's children itself, as the registry lists them.
      #
      # It then asks the registry where each signature landed, rather than
      # asking the binary that just wrote it whether it likes what it wrote --
      # `cosign verify` accepts every layout cosign has written. The setting
      # promises SIGNATURE_LAYOUT (`referrer`): a referrer and no
      # `sha256-<digest>` tag, for the index and every child. A signature in
      # two places fails.
      - name: Verify the signatures and where they are published
        env:
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: |
          bazel run --config=ci //bazel/cosign:verify_image -- \
            "${{ steps.digest.outputs.server }}" \
            "${{ steps.digest.outputs.csi }}" \
            "${{ steps.digest.outputs.provider_s3 }}" \
            "${{ steps.digest.outputs.provider_file }}"

      # The chart carries the digest of every image it deploys, pinned at
      # package time, so this publishes a chart that can only ever reference
      # the images signed above (and the step before the login checked that the pin is that
      # digest). `helm push` appends the chart's name to the base the target
      # names, so it lands in CHART_REPOSITORY under its version. rules_helm
      # logs in to the registry with the HELM_REGISTRY_* variables.
      - name: Push the chart
        id: chart
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          bazel run --config=ci //charts/stevedore:stevedore.push_registry 2>&1 | tee chart-push.log
          # helm prints the digest of the manifest it pushed; that, not a tag
          # looked up afterwards, is what gets signed.
          # `|| true`: grep exits 1 when nothing matches, and under pipefail
          # that would end the step here, before the message below that says
          # what went wrong.
          digest="$(grep -oE '^Digest: sha256:[0-9a-f]{64}$' chart-push.log | tail -1 | cut -d' ' -f2 || true)"
          pushed="$(grep -oE '^Pushed: [^ ]+$' chart-push.log | tail -1 | cut -d' ' -f2 || true)"
          if [ -z "${digest}" ]; then
            echo "::error::the chart push printed no digest" >&2
            exit 1
          fi
          want="${CHART_REPOSITORY}:${CHART_VERSION}"
          if [ "${pushed}" != "${want}" ]; then
            echo "::error::the chart went to '${pushed}', want ${want}" >&2
            exit 1
          fi
          echo "ref=${CHART_REPOSITORY}@${digest}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${CHART_REPOSITORY}@${digest}"

      # The chart is an artifact people install by name, so it is signed like
      # the images it names: keyless, by digest, as a referrer. A chart is one
      # manifest, not an index: --single verifies it and where its signature
      # landed, without looking for children. Like the images, a chart whose
      # content did not change keeps its digest, so it is signed only when it
      # is not already.
      - name: Sign the chart
        env:
          COSIGN_YES: "true"
          CHART_REF: ${{ steps.chart.outputs.ref }}
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: |
          set -euo pipefail
          rc=0
          bazel run --config=ci //bazel/cosign:verify_image -- --single "${CHART_REF}" >presign.log 2>&1 || rc=$?
          case "${rc}" in
            0)
              echo "${CHART_REF} is already signed by this workflow"
              exit 0
              ;;
            1) ;;
            *)
              cat presign.log
              echo "::error::could not check whether ${CHART_REF} is already signed (exit ${rc})" >&2
              exit 1
              ;;
          esac
          bazel run --config=ci //bazel/cosign -- sign "${CHART_REF}"

      - name: Verify the chart's signature and where it is published
        env:
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: bazel run --config=ci //bazel/cosign:verify_image -- --single "${{ steps.chart.outputs.ref }}"

  # The GitHub Release of a tag: how to install it, what was published, by
  # digest, and how to verify it, then the changes since the last release. A
  # job of its own, so that the publishing job, which holds the registry
  # credential, never also holds a token that can write to the repository.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the registry setting
        run: scripts/registry.sh >> "${GITHUB_ENV}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION: ${{ needs.publish.outputs.chart_version }}
          CHART_REF: ${{ needs.publish.outputs.chart }}
          SERVER_REF: ${{ needs.publish.outputs.server }}
          CSI_REF: ${{ needs.publish.outputs.csi }}
          PROVIDER_FILE_REF: ${{ needs.publish.outputs.provider_file }}
          PROVIDER_S3_REF: ${{ needs.publish.outputs.provider_s3 }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=()
          if [[ "${tag}" == *-rc.* ]]; then
            prerelease=(--prerelease)
          fi
          # The changes since the last release, not since the last candidate:
          # a candidate's notes would otherwise leave the release's nearly
          # empty. The first release has none before it, and lists everything.
          previous="$(git tag --list 'v*' --sort=-version:refname --merged "${GITHUB_SHA}" |
            grep -Ev -- '-rc\.' | grep -vx "${tag}" | head -1 || true)"
          args=(-f "tag_name=${tag}")
          if [ -n "${previous}" ]; then
            args+=(-f "previous_tag_name=${previous}")
          fi
          changes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" --jq .body)"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@${GITHUB_REF}"
          cat >notes.md <<NOTES
          ## Install

          \`\`\`bash
          helm install stevedore oci://${CHART_REPOSITORY} --version ${CHART_VERSION} \\
            --namespace stevedore-system --create-namespace
          \`\`\`

          The chart pins every image by digest. Every component of a release must
          run the same version: in 0.x a release may change the protocol between
          them.

          ## Published

          | Artifact | Reference |
          |---|---|
          | Chart ${CHART_VERSION} | \`${CHART_REF}\` |
          | server | \`${SERVER_REF}\` |
          | csi | \`${CSI_REF}\` |
          | provider-file | \`${PROVIDER_FILE_REF}\` |
          | provider-s3 | \`${PROVIDER_S3_REF}\` |

          The images are also tagged \`${tag}\`.

          ## Verify

          Each image, its platform manifests and the chart are signed by this
          release's workflow run:

          \`\`\`bash
          cosign verify ${CSI_REF} \\
            --certificate-identity '${identity}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          ${changes}
          NOTES
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "Stevedore ${tag}" --notes-file notes.md "${prerelease[@]}"
