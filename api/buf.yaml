# What buf checks in the protos. buf does not compile or generate anything
# here: Bazel does. //api/stevedore/v1:stevedorev1_proto_lint_test runs the lint
# rules and scripts/proto-breaking.sh the breaking ones.
version: v2
lint:
  use:
    - STANDARD
    # Every message, field, enum, enum value, service and RPC carries a
    # comment: the comments are the reference documentation.
    - COMMENTS
  except:
    # The services and their stream messages were named before this check
    # existed. A service's name is part of every RPC's path, so renaming one
    # to satisfy a style rule would break every deployed peer.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    # What components at different versions need of each other: no field
    # renumbered, retyped or reused, nothing deleted without its number
    # reserved, no RPC or service renamed. For JSON as well as for the binary
    # encoding, because applications use app.proto as JSON.
    - WIRE_JSON
  ignore_only:
    # Between Stevedore's own components only the binary encoding is used, so
    # there a field or an enum value may be renamed: only the generated code
    # sees its name. In app.proto the names are the JSON an application
    # writes, and stay checked.
    FIELD_SAME_JSON_NAME: &internal
      - stevedore/v1/common.proto
      - stevedore/v1/discovery.proto
      - stevedore/v1/peer.proto
      - stevedore/v1/provider.proto
    FIELD_SAME_NAME: *internal
    ENUM_VALUE_SAME_NAME: *internal
