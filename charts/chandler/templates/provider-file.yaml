{{- if .Values.providers.file.enabled -}}
{{- $selector := dict "root" . "component" "provider-file" -}}
{{- $file := .Values.providers.file -}}
{{- if not $file.source }}
{{- fail "providers.file.source is required when the file provider is enabled: the volume to serve, e.g. configMap: {name: app-config}" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chandler.name" . }}-provider-file
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chandler.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-file
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chandler.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chandler.labels" . | nindent 8 }}
        app.kubernetes.io/component: provider-file
      {{- with $file.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $file.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $file.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: provider
          image: {{ include "chandler.image" (dict "root" . "image" $file.image) }}
          imagePullPolicy: {{ $file.image.pullPolicy }}
          args:
            - --listen=:{{ $file.port }}
            - --name={{ $file.name }}
            - --root=/config
            - --poll-interval={{ $file.pollInterval }}
          ports:
            - name: grpc
              containerPort: {{ $file.port }}
          readinessProbe:
            grpc:
              port: {{ $file.port }}
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: {{ $file.port }}
            periodSeconds: 10
          securityContext:
            {{- include "chandler.restrictedSecurityContext" . | nindent 12 }}
          {{- with $file.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          {{- toYaml $file.source | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chandler.name" . }}-provider-file
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chandler.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-file
spec:
  selector:
    {{- include "chandler.selectorLabels" $selector | nindent 4 }}
  ports:
    - name: grpc
      port: {{ $file.port }}
      targetPort: grpc
      appProtocol: grpc
{{- end }}
