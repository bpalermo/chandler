{{- $selector := dict "root" . "component" "csi" -}}
{{- $server := dict "root" . "component" "server" -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "stevedore.name" . }}-csi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stevedore.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi
spec:
  selector:
    matchLabels:
      {{- include "stevedore.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stevedore.labels" . | nindent 8 }}
        app.kubernetes.io/component: csi
      {{- with .Values.csi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.csi.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "stevedore.name" . }}-csi
      # Used for one thing, when asked to: recording events on pods.
      automountServiceAccountToken: {{ .Values.csi.podEvents }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: driver
          image: {{ include "stevedore.image" (dict "root" . "image" .Values.csi.image) }}
          imagePullPolicy: {{ .Values.csi.image.pullPolicy }}
          args:
            - --endpoint=unix:///csi/csi.sock
            - --state-dir={{ .Values.csi.stateDir }}
            - --server={{ include "stevedore.name" . }}-server.{{ .Release.Namespace }}.svc:{{ .Values.server.port }}
            - --server-identity={{ include "stevedore.identity" $server }}
            - --token-audience={{ .Values.server.podIdentity.audience }}
            - --pod-events={{ .Values.csi.podEvents }}
            {{- include "stevedore.tlsArgs" $selector | nindent 12 }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- include "stevedore.telemetryEnv" . | nindent 12 }}
          securityContext:
            # Mounting into kubelet's pod directories needs CAP_SYS_ADMIN and
            # Bidirectional propagation, which requires privileged.
            privileged: true
          {{- with .Values.csi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-dir
              mountPath: {{ .Values.csi.kubeletDir }}/pods
              mountPropagation: Bidirectional
            # Same path as on the host, so a bind mount's source means the
            # same thing inside and outside the container.
            - name: state-dir
              mountPath: {{ .Values.csi.stateDir }}
              # A volume kept in memory is a tmpfs mounted here. It has to
              # exist on the host, not only in this container, to outlive a
              # restart of the driver.
              mountPropagation: Bidirectional
            {{- include "stevedore.tlsVolumeMount" $selector | nindent 12 }}
        - name: registrar
          image: {{ include "stevedore.image" (dict "root" . "image" .Values.csi.registrar.image) }}
          imagePullPolicy: {{ .Values.csi.registrar.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.csi.kubeletDir }}/plugins/config.csi.stevedore.dev/csi.sock
          {{- with .Values.csi.registrar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: plugin-dir
          hostPath:
            path: {{ .Values.csi.kubeletDir }}/plugins/config.csi.stevedore.dev
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.csi.kubeletDir }}/plugins_registry
            type: Directory
        - name: pods-dir
          hostPath:
            path: {{ .Values.csi.kubeletDir }}/pods
            type: Directory
        - name: state-dir
          hostPath:
            path: {{ .Values.csi.stateDir }}
            type: DirectoryOrCreate
        {{- include "stevedore.tlsVolume" $selector | nindent 8 }}
