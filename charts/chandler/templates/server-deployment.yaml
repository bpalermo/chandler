{{- $selector := dict "root" . "component" "server" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chandler.name" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chandler.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A replica is replaced only once its successor is ready, which means
      # warm: it has copied the cache. The cache therefore survives a rollout
      # even while a provider is down.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "chandler.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chandler.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "chandler.image" (dict "root" . "image" .Values.server.image) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          args:
            - --listen=:{{ .Values.server.port }}
            - --peer-service={{ include "chandler.name" . }}-server-peers.{{ .Release.Namespace }}.svc:{{ .Values.server.port }}
            - --peer-sync-interval={{ .Values.server.peerSync.interval }}
            - --peer-warm-up={{ .Values.server.peerSync.warmUp }}
            - --cache-dir=/var/cache/chandler
            - --cache-grace={{ .Values.server.cache.grace }}
            - --negative-ttl={{ .Values.server.cache.negativeTtl }}
            - --max-bundle-bytes={{ int64 .Values.server.maxBundleBytes }}
            - --max-bundle-files={{ int64 .Values.server.maxBundleFiles }}
            {{- if .Values.providers.file.enabled }}
            - --provider={{ .Values.providers.file.name }}={{ include "chandler.name" . }}-provider-file.{{ .Release.Namespace }}.svc:{{ .Values.providers.file.port }}
            {{- end }}
            {{- if .Values.providers.s3.enabled }}
            - --provider={{ .Values.providers.s3.name }}={{ include "chandler.name" . }}-provider-s3.{{ .Release.Namespace }}.svc:{{ .Values.providers.s3.port }}
            {{- end }}
            {{- range .Values.server.providers }}
            - --provider={{ required "server.providers[].name is required" .name }}={{ required "server.providers[].target is required" .target }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: grpc
              containerPort: {{ .Values.server.port }}
          # Ready once the cache is warm.
          readinessProbe:
            grpc:
              port: {{ .Values.server.port }}
            periodSeconds: 2
          livenessProbe:
            grpc:
              port: {{ .Values.server.port }}
              # Alive, as opposed to ready: see the readiness probe above.
              service: live
            periodSeconds: 10
          securityContext:
            {{- include "chandler.restrictedSecurityContext" . | nindent 12 }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/chandler
      securityContext:
        # The image's user; makes the emptyDir writable by it.
        fsGroup: 65532
      # Replicas hold each other's cache, so they should not share a fate.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "chandler.selectorLabels" $selector | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "chandler.selectorLabels" $selector | nindent 14 }}
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.server.cache.sizeLimit }}
