# How e2e/run.sh installs the chart in the kind cluster. The images are the
# chart's own: e2e/values-local.yaml replaces them with the ones built from
# this checkout, unless run.sh tests a published chart.
# Metrics go to the collector run.sh deploys, often, so the tests can see them.
telemetry:
  otlpEndpoint: http://otel-collector.stevedore-system.svc:4317
  exportIntervalSeconds: 5
  resourceAttributes:
    k8s.cluster.name: stevedore-e2e
server:
  # Two replicas on the one node, syncing often so the tests do not wait.
  replicas: 2
  # Connections are cut every half minute, so the whole suite runs with
  # drivers reconnecting, as they do every half hour in production.
  maxConnectionAge: 30s
  peerSync:
    interval: 2s
  # A second file provider, deployed by run.sh from e2e/small-provider.yaml
  # with the chart's file provider's certificate, and allowed two cache keys:
  # what the eviction test fills.
  providers:
    - name: small
      target: stevedore-provider-small.stevedore-system.svc:9100
      identity: stevedore-provider-file.stevedore-system.svc
  cache:
    providerQuotas:
      small:
        maxKeys: 2
providers:
  # Serves the ConfigMap run.sh creates and the tests add keys to.
  file:
    enabled: true
    source:
      configMap:
        name: stevedore-e2e-config
    pollInterval: 500ms
    # Keys the rollout test uses are released to half the pods for a while;
    # everything else goes to every pod at once.
    rollouts:
      - match: "/*.staged.yaml"
        ramp: "50%:45s"
    # One application that does not report in time holds a rollout.
    rolloutMaxOverdue: 0

  # Serves a bucket of the LocalStack that runs beside it, so the S3 provider
  # is exercised against an S3 API without anything outside the cluster.
  s3:
    enabled: true
    buckets:
      - stevedore-e2e
    region: us-east-1
    endpointUrl: http://localhost:4566
    pathStyle: true
    pollInterval: 1s
    env:
      # LocalStack accepts any credentials; the SDK insists on having some.
      - name: AWS_ACCESS_KEY_ID
        value: test
      - name: AWS_SECRET_ACCESS_KEY
        value: test
    extraContainers:
      - name: localstack
        # The archived community S3 image: S3 only, and no account needed.
        image: docker.io/localstack/localstack:s3-community-archive@sha256:b14111811a1071ff8e05ea2d89fac68dc3aa115bcb0b053f5502a1dfffba4ff8
        ports:
          - name: s3
            containerPort: 4566
        readinessProbe:
          httpGet:
            path: /_localstack/health
            port: 4566
          periodSeconds: 2
