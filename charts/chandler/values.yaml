# Overrides the name used for the chart's resources (default: the chart name).
nameOverride: ""

# Pull secrets added to every pod of the chart.
imagePullSecrets: []

# Every image of the chart is set the same way:
#
#   repository  Substituted at package time from the component's image_push
#               target, which takes it from bazel/registry.bzl: the registry
#               is spelled out in one place.
#   tag         Defaults to the chart's appVersion. Ignored when digest is set.
#   digest      Substituted at package time with the digest of the image index
#               the push target publishes, so a published chart can only
#               reference the images built from the same commit. Takes
#               precedence over tag. A chart you build yourself pins the image
#               YOUR build produces, which exists nowhere until it is pushed:
#               install it with `--set <component>.image.digest=` (empty) to
#               use `tag` instead, as e2e/run.sh does.

# The config server. CSI drivers subscribe to it, and it watches the providers.
server:
  image:
    repository: "{@//server:image_push.repository}"
    tag: ""
    digest: "{@//server:image_push.digest}"
    pullPolicy: IfNotPresent

  # Each replica watches the providers itself and serves the drivers connected
  # to it. Replicas copy each other's cache, which is how it survives a pod
  # being replaced without a persistent volume: run at least two.
  replicas: 2

  peerSync:
    # How often a replica syncs its cache with one other.
    interval: 30s
    # The longest a starting replica stays unready while it copies the cache
    # of the ready ones.
    warmUp: 60s

  # The gRPC port drivers connect to.
  port: 9000

  # Providers that run outside this chart, each as
  #   - name: s3          # the scheme of the URIs it serves; lowercase
  #     target: host:port # gRPC target of its ConfigProvider service
  # The file provider below registers itself when enabled.
  providers: []

  # The cache of what the providers emitted. It lives on an emptyDir: it
  # survives a container restart, and is refilled from the providers after the
  # pod is replaced.
  cache:
    # The emptyDir's size limit. The server holds at most 1Gi per provider.
    sizeLimit: 2Gi
    # How long an entry no pod uses is kept.
    grace: 24h
    # How long a not-found or permission-denied answer from a provider is
    # remembered, so a crash-looping pod does not hammer it.
    negativeTtl: 30s

  # Limits on what a provider may emit for one URI. A bundle travels in one
  # gRPC message, so maxBundleBytes cannot exceed 3145728.
  maxBundleBytes: 1048576
  maxBundleFiles: 256

  nodeSelector: {}
  tolerations: []
  resources: {}
  podAnnotations: {}

providers:
  # The file provider serves the files of one pod volume: a ConfigMap, or any
  # other volume something keeps up to date. <name>:///app.yaml is the file
  # app.yaml at the root of the volume; <name>:///flags/ is a directory.
  #
  # It has no way to validate what it serves. Whoever writes the volume is
  # responsible for its content.
  file:
    enabled: false

    image:
      repository: "{@//providers/file:image_push.repository}"
      tag: ""
      digest: "{@//providers/file:image_push.digest}"
      pullPolicy: IfNotPresent

    # The scheme pods use for this provider's URIs.
    name: file

    # The volume to serve, as a Kubernetes volume source. Required when the
    # provider is enabled. For example:
    #   source:
    #     configMap:
    #       name: app-config
    source: {}

    # How often watched files are re-read. A change to a mounted ConfigMap
    # also has to reach the pod first, which kubelet does about once a minute.
    pollInterval: 2s

    port: 9100

    nodeSelector: {}
    tolerations: []
    resources: {}
    podAnnotations: {}

  # The S3 provider serves objects from S3 buckets: <name>://<bucket>/<key> is
  # one object, <name>://<bucket>/<prefix>/ every object below a prefix.
  #
  # It is a reference implementation. It only reads, so whoever writes to the
  # bucket is responsible for the validity of what is there.
  s3:
    enabled: false

    image:
      repository: "{@//providers/s3:image_push.repository}"
      tag: ""
      digest: "{@//providers/s3:image_push.digest}"
      pullPolicy: IfNotPresent

    # The scheme pods use for this provider's URIs. Two buckets with different
    # credentials are two releases of the provider under two names.
    name: s3

    # The buckets URIs may name. Empty allows any bucket the credentials can
    # read, which lets every pod read all of them; list the buckets.
    buckets: []

    # The AWS region. Required unless the environment provides one.
    region: ""

    # For an S3-compatible store: its endpoint, and whether buckets are
    # addressed as <endpoint>/<bucket> rather than <bucket>.<endpoint>.
    endpointUrl: ""
    pathStyle: false

    # How often watched objects are checked for change.
    pollInterval: 30s

    port: 9100

    # Credentials come from the AWS SDK's default chain. With IAM roles for
    # service accounts, annotate the service account with the role:
    #   serviceAccount:
    #     annotations:
    #       eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/chandler-s3
    serviceAccount:
      create: true
      # Defaults to <release name>-provider-s3.
      name: ""
      annotations: {}

    # Extra environment variables, e.g. static credentials from a Secret:
    #   env:
    #     - name: AWS_ACCESS_KEY_ID
    #       valueFrom: {secretKeyRef: {name: s3-credentials, key: access-key-id}}
    env: []

    # Extra containers for the provider's pod.
    extraContainers: []

    nodeSelector: {}
    tolerations: []
    resources: {}
    podAnnotations: {}

# The CSI node driver, one pod per node.
csi:
  image:
    repository: "{@//csi:image_push.repository}"
    tag: ""
    digest: "{@//csi:image_push.digest}"
    pullPolicy: IfNotPresent

  # The sidecar that registers the driver's socket with kubelet.
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.16.0
      digest: sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70
      pullPolicy: IfNotPresent
    resources: {}

  # kubelet's root directory on the nodes. /var/lib/kubelet on most
  # distributions; some (k0s, MicroK8s, ...) use another path.
  kubeletDir: /var/lib/kubelet

  # Where the driver keeps volumes and its cache on each node. It is mounted
  # into the driver at the same path.
  stateDir: /var/lib/chandler

  priorityClassName: system-node-critical

  # Config must be mountable on every node pods can run on.
  tolerations:
    - operator: Exists

  nodeSelector: {}
  resources: {}
  podAnnotations: {}
