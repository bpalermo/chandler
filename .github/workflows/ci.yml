name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs, not tags; the version each SHA
# corresponds to is in the comment beside it. Dependabot keeps them current.
#
# Caches: every job RESTORES the Bazel caches, but only runs on main SAVE them
# (cache-save below), so only reviewed code populates a cache that a later
# trusted build consumes. Gated on the ref rather than the event, because
# workflow_dispatch can target any branch.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No version is pinned here: bazelisk reads .bazelversion, so the
      # checkout is the single source of the Bazel version.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # The registry is one setting, bazel/registry.bzl; a literal anywhere
      # else would survive a move and keep pointing at the old registry.
      - name: The registry is spelled out in one place
        run: scripts/check-registry-config.sh

      # --config=ci refuses lockfile drift.
      - name: bazel build //...
        run: bazel build //... --config=ci

      # publish.yml runs only on main, so everything it runs is built here, on
      # the pull request, first: the image push targets, the chart and its
      # push, and the pinned cosign and verifier. `//...` already includes
      # them; naming them keeps a rename or a removal from passing here and
      # failing on the first merge. Keep this list equal to the one in
      # publish.yml. Nothing is pushed or signed.
      - name: the publish targets build
        run: |
          bazel build --config=ci \
            //server:image_push //server:image_index \
            //csi:image_push //csi:image_index \
            //providers/s3:image_push //providers/s3:image_index \
            //providers/file:image_push //providers/file:image_index \
            //charts/chandler:chandler //charts/chandler:chandler.push_registry \
            //bazel/cosign //bazel/cosign:verify_image

      - name: bazel test //...
        run: bazel test //... --config=ci

      # Gazelle generates the BUILD files, so a hand-edited or stale one is a
      # real failure mode: the build keeps working against the old graph until
      # someone regenerates and the diff appears in an unrelated PR.
      - name: BUILD files are up to date
        run: |
          bazel run --config=ci //:gazelle
          if ! git diff --exit-code -- 'BUILD.bazel' '**/BUILD.bazel'; then
            echo "::error::BUILD files are stale; run 'bazel run //:gazelle'" >&2
            exit 1
          fi

  # End to end in a kind cluster: the images are built from this commit, loaded
  # into the node and exercised as pods (e2e/run.sh). A CSI driver can only be
  # validated against a real kubelet, so this is where the system as deployed
  # is tested; everything else is unit tests. After `build`, so a change that
  # does not compile never gets as far as creating a cluster.
  e2e:
    name: e2e (kind)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-e2e
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # e2e/run.sh uses a cluster of this name if one exists.
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: chandler-e2e

      - name: e2e/run.sh
        run: e2e/run.sh --config=ci

  # The single check the main ruleset requires, and the only reason this job
  # exists.
  #
  # A required status check is matched by check-run name, so requiring the
  # jobs themselves ties the ruleset to their names: rename or split one and
  # the required check can never report again, which blocks every pull request
  # instead of failing it. Requiring one aggregate leaves the jobs free to
  # change.
  #
  # if: always() so it runs even when a job fails; a skipped job reports
  # nothing, and a required check that never reports blocks the pull request.
  ci:
    name: ci
    needs: [build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Reads the results rather than naming the jobs, so adding a job to
      # `needs` above is enough to have it gate merges.
      - name: every job this depends on must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job reported '${result}'" >&2
              exit 1
            fi
          done
