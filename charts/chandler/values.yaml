# Overrides the name used for the chart's resources (default: the chart name).
nameOverride: ""

# Pull secrets added to every pod of the chart.
imagePullSecrets: []

# The CSI node driver, one pod per node.
csi:
  image:
    # Substituted at package time from //csi:image_push, which takes it from
    # bazel/registry.bzl: the registry is spelled out in one place.
    repository: "{@//csi:image_push.repository}"
    # Defaults to the chart's appVersion. Ignored when digest is set.
    tag: ""
    # Substituted at package time with the digest of the image index
    # //csi:image_push publishes, so a published chart can only reference the
    # image built from the same commit. Takes precedence over tag. A chart you
    # build yourself pins the image YOUR build produces, which exists nowhere
    # until it is pushed: install it with `--set csi.image.digest=` (empty) to
    # use `tag` instead, as e2e/run.sh does.
    digest: "{@//csi:image_push.digest}"
    pullPolicy: IfNotPresent

  # The sidecar that registers the driver's socket with kubelet.
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.16.0
      digest: sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70
      pullPolicy: IfNotPresent
    resources: {}

  # kubelet's root directory on the nodes. /var/lib/kubelet on most
  # distributions; some (k0s, MicroK8s, ...) use another path.
  kubeletDir: /var/lib/kubelet

  # Where the driver keeps volumes and its cache on each node. It is mounted
  # into the driver at the same path.
  stateDir: /var/lib/chandler

  priorityClassName: system-node-critical

  # Config must be mountable on every node pods can run on.
  tolerations:
    - operator: Exists

  nodeSelector: {}
  resources: {}
  podAnnotations: {}
