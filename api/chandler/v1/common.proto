syntax = "proto3";

package chandler.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/bpalermo/chandler/api/chandler/v1;chandlerv1";

// File is one regular file inside a Bundle.
message File {
  // Path relative to the source's mount path. Must be clean and relative: no
  // leading "/", no "." or ".." segments, and no segment starting with ".."
  // (reserved for the atomic writer's bookkeeping entries).
  string path = 1;

  // Unix permission bits. Zero means 0444.
  uint32 mode = 2;

  bytes content = 3;
}

// Bundle is the unit of atomic delivery for one URI: either a single file or a
// directory tree. A bundle is always applied or rejected as a whole.
//
// The bundle's version is "sha256:<hex>" over its canonical encoding: files
// sorted by path, each contributing len(path) | path | mode | sha256(content).
// Versions are therefore content addresses, independent of the provider's own
// revision identifiers.
message Bundle {
  repeated File files = 1;
}

// CacheControl carries the HTTP-style caching directives a provider attaches
// to a resource. It governs both the server cache and the node cache.
message CacheControl {
  // How long the resource is fresh once its provider watch is no longer live.
  // While the watch is live the resource is always fresh.
  google.protobuf.Duration max_age = 1;

  // How long past max_age a stale resource may still be served to NEW
  // subscriptions when the provider is unavailable. Unset means unlimited.
  // Existing subscribers always keep what they already applied.
  google.protobuf.Duration stale_if_error = 2;

  // The content must never be written to persistent storage: the server keeps
  // it in memory only and the node materialises it on tmpfs, bypassing the
  // node cache. Replicas still copy it to each other, in memory.
  bool no_store = 3;
}

// Track says which side of an in-progress rollout a subscription is on.
enum Track {
  TRACK_UNSPECIFIED = 0;
  TRACK_STABLE = 1;
  TRACK_CANDIDATE = 2;
}
