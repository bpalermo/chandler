{{- if .Values.providers.file.enabled -}}
{{- $selector := dict "root" . "component" "provider-file" -}}
{{- $file := .Values.providers.file -}}
{{- if not $file.source }}
{{- fail "providers.file.source is required when the file provider is enabled: the volume to serve, e.g. configMap: {name: app-config}" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stevedore.name" . }}-provider-file
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stevedore.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-file
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "stevedore.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stevedore.labels" . | nindent 8 }}
        app.kubernetes.io/component: provider-file
      {{- with $file.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $file.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $file.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: provider
          image: {{ include "stevedore.image" (dict "root" . "image" $file.image) }}
          imagePullPolicy: {{ $file.image.pullPolicy }}
          args:
            - --listen=:{{ $file.port }}
            - --health-listen=:{{ add (int $file.port) 1 }}
            {{- include "stevedore.tlsArgs" $selector | nindent 12 }}
            - --server-identity={{ include "stevedore.identity" (dict "root" . "component" "server") }}
            - --name={{ $file.name }}
            - --root=/config
            - --poll-interval={{ $file.pollInterval }}
            {{- range $file.rollouts }}
            - --rollout={{ with .match }}{{ . }}={{ end }}{{ required "a rollout rule needs a ramp" .ramp }}
            {{- end }}
            - --rollout-max-refused={{ $file.rolloutMaxRefused }}
            - --rollout-max-overdue={{ $file.rolloutMaxOverdue }}
          {{- with (include "stevedore.telemetryEnv" .) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: {{ $file.port }}
            - name: health
              containerPort: {{ add (int $file.port) 1 }}
          readinessProbe:
            grpc:
              port: {{ add (int $file.port) 1 }}
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: {{ add (int $file.port) 1 }}
            periodSeconds: 10
          securityContext:
            {{- include "stevedore.restrictedSecurityContext" . | nindent 12 }}
          {{- with $file.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- include "stevedore.tlsVolumeMount" $selector | nindent 12 }}
      volumes:
        - name: config
          {{- toYaml $file.source | nindent 10 }}
        {{- include "stevedore.tlsVolume" $selector | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stevedore.name" . }}-provider-file
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stevedore.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-file
spec:
  selector:
    {{- include "stevedore.selectorLabels" $selector | nindent 4 }}
  ports:
    - name: grpc
      port: {{ $file.port }}
      targetPort: grpc
      appProtocol: grpc
{{- end }}
