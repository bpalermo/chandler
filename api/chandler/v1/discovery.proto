edition = "2024";

// The protocol between the CSI node driver and the config server.
package chandler.v1;

import "chandler/v1/common.proto";
import "google/rpc/status.proto";

option go_package = "github.com/bpalermo/chandler/api/chandler/v1;chandlerv1";

// ConfigDiscoveryService is spoken between the CSI node driver (client) and
// the config server. One long-lived stream per node multiplexes every
// subscription of every pod volume on that node.
//
// The ACK/NACK semantics follow Envoy's incremental xDS, with two deliberate
// differences:
//
//   * requests are a oneof instead of one overloaded message, so an ACK can
//     never be confused with a subscription change;
//   * a response carries exactly one subscription's update, so a NACK concerns
//     one source of one pod and nothing else.
//
// Configuration content is opaque to both ends. An Ack means "written", a Nack
// means "could not be written"; neither says anything about whether the
// configuration is valid. Only an AppReport, which relays the application's own
// verdict, speaks about the content.
service ConfigDiscoveryService {
  // Opens the node's stream.
  //
  // The driver sends NodeHello first and the server answers with ServerHello.
  // After that the driver sends Subscribe and Unsubscribe as pod volumes come
  // and go, the server sends one ConfigUpdate or SubscriptionError per
  // subscription event, and the driver answers every ConfigUpdate with an Ack
  // or a Nack.
  //
  // The stream carries no state across reconnects: after a reconnect the
  // driver subscribes to everything again, reporting what each volume already
  // holds.
  rpc StreamConfigs(stream ConfigRequest) returns (stream ConfigResponse);
}

// ConfigRequest is a message from the driver to the server. Exactly one member
// of the oneof is set.
message ConfigRequest {
  oneof request {
    // Identifies the node. Must be the first message on the stream and must
    // not be sent again.
    NodeHello hello = 1;

    // Starts a subscription for one source of one pod volume.
    Subscribe subscribe = 2;

    // Ends a subscription, typically because the pod volume was unmounted.
    Unsubscribe unsubscribe = 3;

    // Reports that a ConfigUpdate was written to the volume.
    Ack ack = 4;

    // Reports that a ConfigUpdate could not be written to the volume.
    Nack nack = 5;

    // Relays the application's own verdict on a version it was given.
    AppReport app_report = 6;
  }
}

// ConfigResponse is a message from the server to the driver. Exactly one
// member of the oneof is set.
message ConfigResponse {
  oneof response {
    // Identifies the server and announces its limits. Always the first message
    // on the stream, sent in answer to NodeHello.
    ServerHello hello = 1;

    // Tells the driver which version one subscription must converge to.
    ConfigUpdate update = 2;

    // Tells the driver that no version can currently be produced for one
    // subscription.
    SubscriptionError error = 3;
  }
}

// NodeHello introduces the driver. It is the first message on every stream.
message NodeHello {
  // Kubernetes node name the driver runs on. Required. Must match the identity
  // in the driver's client certificate.
  string node_id = 1;

  // Name of the Kubernetes cluster the node belongs to. Informational; used in
  // logs and metrics.
  string cluster = 2;

  // Version of the driver binary. Informational.
  string driver_version = 3;

  // Low-cardinality attributes of the node, such as "region" and "zone". A
  // provider may declare some of them as vary dimensions (see
  // ProviderHello.vary_on), in which case they take part in cache keys.
  // Attributes no provider declared are ignored.
  //
  // Values that are unique per node or per pod must not be sent here.
  map<string, string> attributes = 4;
}

// ServerHello introduces the server. It is the first message the server sends.
message ServerHello {
  // Identity of the server replica that accepted the stream. Informational;
  // used to correlate driver and server logs.
  string server_id = 1;

  // Largest Bundle, in bytes of file content, the server will ever send. The
  // driver uses it to size volumes and may fail a mount early when a volume's
  // size limit is smaller.
  uint64 max_bundle_bytes = 2;
}

// Workload identifies the pod behind a subscription. It is used to authorise
// the subscription, to place the pod in a rollout, and to derive the
// attributes a provider varies on. It is never part of a cache key as a whole.
message Workload {
  // Namespace of the pod. Required.
  string namespace = 1;

  // Name of the pod. Required.
  string pod_name = 2;

  // UID of the pod. Required. This is the value hashed to decide whether the
  // pod receives a rollout's candidate version.
  string pod_uid = 3;

  // Name of the pod's service account. Required.
  string service_account = 4;

  // Projected service account token for the pod, with the config server as
  // audience, obtained through the CSIDriver tokenRequests mechanism.
  // Required.
  //
  // The server verifies it and takes the pod's identity from the token; the
  // other fields of this message must agree with it or the subscription is
  // refused with PERMISSION_DENIED. Never logged.
  string service_account_token = 5;
}

// Subscribe starts a subscription: one source (URI) of one pod volume. The
// server answers every Subscribe with exactly one initial ConfigUpdate or
// SubscriptionError, and with further ConfigUpdates whenever the version the
// subscription should hold changes.
message Subscribe {
  // Identifier of the subscription, chosen by the driver. Required. Unique
  // within the stream and stable across reconnects, formed as
  // "<csi-volume-id>/<source-index>". Every later message about the
  // subscription carries it.
  string subscription_id = 1;

  // The resource to deliver, as written in the pod's volumeAttributes:
  // "<provider-name>://<authority>/<path>?<query>". Required. The scheme
  // selects the provider; the rest is interpreted by that provider.
  string uri = 2;

  // The pod the subscription belongs to. Required.
  Workload workload = 3;

  // Version currently written in the volume for this source, i.e. its last
  // known good version. Unset on first mount. After a reconnect it lets the
  // server see what the pod is actually running.
  string applied_version = 4;

  // Versions of this resource whose bytes are present in the node cache, at
  // most four. When the server's answer is one of them it sends UseCached
  // instead of the Bundle, the equivalent of an HTTP 304.
  repeated string cached_versions = 5;

  // True when the pod's volume opted in to application acknowledgement, so the
  // server can expect an AppReport for every version written to this
  // subscription. Rollout thresholds on application reports only count
  // subscriptions that set it. Defaults to false.
  bool app_ack = 6;

  // The last version of this source the application reported as loaded. Unset
  // when app_ack is false or the application has not reported yet. After a
  // reconnect it tells the server what the application is actually running,
  // which may be older than applied_version.
  string loaded_version = 7;

  // The versions of this source the application rejected. After a reconnect
  // they tell the server, which keeps this only for the life of a stream,
  // what not to send again and what to keep counting toward the provider's
  // feedback. Unset when app_ack is false.
  repeated string rejected_versions = 8;

  // The version the application was given and has not reported on within the
  // time its volume allows, as last reported with STATE_OVERDUE. Unset when
  // there is none.
  string overdue_version = 9;
}

// Unsubscribe ends a subscription. The server stops sending updates for it and
// releases its reference on the resource. Unknown identifiers are ignored.
message Unsubscribe {
  // The subscription to end. Required.
  string subscription_id = 1;
}

// ConfigUpdate tells the driver which version a subscription must converge to.
// It is sent once in answer to a Subscribe and again whenever the target
// changes: a new version from the provider, placement in a rollout, or a
// rollout that was taken back returning the pod to the stable version.
//
// The driver must answer with an Ack or a Nack carrying the same nonce.
message ConfigUpdate {
  // The subscription this update is for.
  string subscription_id = 1;

  // Identifier of this update, unique within the stream. The driver echoes it
  // in the Ack or Nack. The server only acts on the answer to the latest nonce
  // it sent for a subscription, so an update may be superseded before it is
  // answered.
  string nonce = 2;

  // The version the subscription must hold, "sha256:<hex>". The driver
  // verifies the Bundle against it before writing.
  string version = 3;

  // The provider-issued cache key of the resource. The node cache files this
  // version under it, so that later subscriptions to any URI resolving to the
  // same key can be served from the cache.
  string cache_key = 4;

  // How the driver obtains the bytes. Exactly one member is set.
  oneof payload {
    // The full content of the version.
    Bundle bundle = 5;

    // The version is one the driver reported in Subscribe.applied_version or
    // Subscribe.cached_versions: take it from the node cache. If the cache no
    // longer has it, the driver answers with a DATA_LOSS Nack and the server
    // resends with the Bundle.
    UseCached use_cached = 6;
  }

  // Caching directives for this version in the node cache. When unset the node
  // caches the version without restriction.
  CacheControl cache_control = 7;

  // True when the server is answering from its cache because the provider is
  // unavailable, so a newer version may exist at the origin. Informational;
  // the driver records it as a pod event and a metric.
  bool stale = 8;

  // Which side of a rollout this subscription is on. TRACK_UNSPECIFIED when no
  // rollout is in progress for the resource.
  Track track = 9;

  // The version being rolled out for the resource, whichever side this
  // subscription is on. Unset when no rollout is in progress.
  string rollout = 10;
}

// UseCached is the payload of a ConfigUpdate whose bytes the node already has.
// It carries no fields; the version to use is ConfigUpdate.version.
message UseCached {}

// Ack confirms that a version was written: verified against its digest and
// atomically swapped into the volume. It is now the subscription's last known
// good version.
//
// Content is opaque to the driver, so an Ack says nothing about whether the
// configuration itself is valid.
message Ack {
  // The subscription the update was for.
  string subscription_id = 1;

  // The nonce of the ConfigUpdate being acknowledged.
  string nonce = 2;

  // The version that was written; equals ConfigUpdate.version.
  string version = 3;
}

// Nack reports that a version could not be written. The volume still serves
// applied_version untouched.
//
// A Nack is a delivery failure, never a judgement of the content.
// error_detail.code tells the server what to do next:
//
//   DATA_LOSS            digest mismatch, or a UseCached version missing from
//                        the node cache: resend the full bundle
//   RESOURCE_EXHAUSTED   node disk or volume size limit full: retry with backoff
//   INTERNAL             I/O error while staging or swapping: retry with backoff
//   FAILED_PRECONDITION  path collides with another source of the same volume:
//                        do not resend to this subscription
//   INVALID_ARGUMENT     unsafe path or bundle over the limits: do not resend
//                        to this subscription
message Nack {
  // The subscription the update was for.
  string subscription_id = 1;

  // The nonce of the ConfigUpdate being refused.
  string nonce = 2;

  // The version that could not be written; equals ConfigUpdate.version.
  string version = 3;

  // The version still in effect in the volume after the failure. Unset when
  // the volume has never held a version for this source.
  string applied_version = 4;

  // Why the write failed. Required. The code is one of those listed above and
  // decides the server's reaction; the message is for humans.
  google.rpc.Status error_detail = 5;
}

// AppReport relays what the application said about a version, for a
// subscription that set Subscribe.app_ack. The application reports to the
// driver over the HTTP API on the Unix socket in its volume; the driver
// forwards one AppReport per source affected. It needs no answer.
//
// This is a later, separate stage from Ack. Ack means the driver wrote the
// version; AppReport says whether the application could use it. It is the only
// signal in the protocol about the content itself, and the judgement is the
// application's: the driver and the server only carry it.
message AppReport {
  // State is the application's verdict on a version.
  enum State {
    // Not set. Never sent.
    STATE_UNSPECIFIED = 0;

    // The application loaded the version and is running with it. The version
    // is now the subscription's last known good.
    STATE_LOADED = 1;

    // The application refused the version. The driver has already put the
    // previous loaded version back in the volume, if there was one. The server
    // must not send this version to this subscription again.
    STATE_REJECTED = 2;

    // The application was given the version and has said nothing about it
    // within the time its volume allows. Sent by the driver, not by the
    // application. Nothing is reverted: a pod is never taken back for being
    // slow to report. A STATE_LOADED or STATE_REJECTED for the same version
    // may still follow, and replaces this.
    STATE_OVERDUE = 3;
  }

  // The subscription the report is about.
  string subscription_id = 1;

  // The version the application judged. It was earlier acknowledged with an
  // Ack on this subscription.
  string version = 2;

  // The application's verdict. Required.
  State state = 3;

  // The application's own explanation, typically the reason for a rejection.
  // Shown to operators; never interpreted. May be unset.
  string message = 4;

  // The version in the volume once the driver has reacted to the report:
  // equal to version after STATE_LOADED or STATE_OVERDUE, and the version
  // the driver reverted to after STATE_REJECTED. Unset when a rejected version was the first one
  // and there was nothing to revert to.
  string applied_version = 5;
}

// SubscriptionError reports that the server cannot currently produce a version
// for a subscription. The subscription stays open: a ConfigUpdate follows as
// soon as one becomes available. It needs no Ack.
//
// status.code is one of:
//
//   UNAUTHENTICATED     the pod's service account token is missing, expired
//                       or not valid; the driver subscribes again when
//                       kubelet supplies a new one
//   NOT_FOUND           the provider has no such resource
//   PERMISSION_DENIED   the workload may not read this URI
//   INVALID_ARGUMENT    malformed URI, or parameters the provider refuses
//   RESOURCE_EXHAUSTED  a cache or subscription quota would be exceeded, or
//                       the resource is larger than a bundle may be
//   UNAVAILABLE         provider down and nothing servable in the cache
message SubscriptionError {
  // The subscription the error is for.
  string subscription_id = 1;

  // What went wrong. The code is one of those listed above; the message is for
  // humans and is surfaced as a pod event.
  google.rpc.Status status = 2;
}
