# Every non-default knob the chart has, so a template test renders the paths
# the defaults leave out.
nameOverride: custom
telemetry:
  otlpEndpoint: https://otel-collector.observability.svc:4317
  exportIntervalSeconds: 15
  resourceAttributes:
    k8s.cluster.name: test
    deployment.environment: ci
tls:
  mode: existing
  existingSecrets:
    csi: csi-certs
    server: server-certs
    providerFile: provider-file-certs
    providerS3: provider-s3-certs
  identities:
    csi: spiffe://example.org/ns/chandler-system/sa/csi
    server: spiffe://example.org/ns/chandler-system/sa/server
imagePullSecrets:
  - name: registry-credentials
csi:
  image:
    repository: registry.example.com/chandler/csi
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    pullPolicy: Always
  podEvents: false
  kubeletDir: /var/lib/k0s/kubelet
  stateDir: /var/lib/chandler-state
  nodeSelector:
    kubernetes.io/os: linux
    node-role.example.com/storage: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  registrar:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
server:
  image:
    repository: registry.example.com/chandler/server
    digest: ""
    tag: v9.9.9
  replicas: 3
  podIdentity:
    verify: false
    audience: config
  peerSync:
    interval: 5s
    warmUp: 20s
  cache:
    sizeLimit: 512Mi
    grace: 1h
    negativeTtl: 5s
    maxKeysPerProvider: 500
    maxBytesPerProvider: 268435456
    providerQuotas:
      s3:
        maxKeys: 2000
        maxBytes: 536870912
      file:
        maxKeys: 10
  port: 9443
  maxConnectionAge: 5m
  providers:
    - name: s3x
      target: provider-s3.config.svc:9100
      identity: spiffe://example.org/ns/config/sa/provider-s3
  maxBundleBytes: 3145728
  maxBundleFiles: 1024
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: dedicated
      operator: Exists
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  podAnnotations:
    example.com/scrape: "true"
providers:
  file:
    enabled: true
    name: cm
    source:
      configMap:
        name: app-config
    pollInterval: 500ms
    rollouts:
      - match: "/payments/*"
        ramp: "1%:5m,10%:10m"
      - ramp: "50%:1m"
    rolloutMaxRefused: 3
    port: 9101
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: dedicated
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    podAnnotations:
      example.com/scrape: "true"
  s3:
    enabled: true
    name: s3-prod
    buckets:
      - acme-config
      - acme-shared
    region: eu-west-1
    endpointUrl: http://localhost:4566
    pathStyle: true
    pollInterval: 5s
    rollouts:
      - match: "acme-config/payments/*"
        ramp: "1%:5m"
    rolloutMaxRefused: -1
    port: 9102
    serviceAccount:
      name: s3-reader
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/chandler-s3
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: s3-credentials
            key: access-key-id
    extraContainers:
      - name: sidecar
        image: registry.example.com/sidecar:1
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: dedicated
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    podAnnotations:
      example.com/scrape: "true"
