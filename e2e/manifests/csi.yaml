# The CSI node driver as the end-to-end suite deploys it into kind. There is no
# published image or chart yet: the image is the one e2e/run.sh builds from the
# checkout and loads into the node, hence the localhost name and
# imagePullPolicy: Never.
apiVersion: v1
kind: Namespace
metadata:
  name: chandler-system
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.chandler.dev
spec:
  # Inline volumes only: nothing to attach, nothing to provision.
  attachRequired: false
  volumeLifecycleModes: [Ephemeral]
  # The driver needs the pod's identity to subscribe on its behalf.
  podInfoOnMount: true
  # Files are read-only and owned by the driver; kubelet must not chown them.
  fsGroupPolicy: None
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chandler-csi
  namespace: chandler-system
  labels:
    app.kubernetes.io/name: chandler-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chandler-csi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chandler-csi
    spec:
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: driver
          image: localhost/chandler-csi:e2e
          imagePullPolicy: Never
          args:
            - --endpoint=unix:///csi/csi.sock
            - --state-dir=/var/lib/chandler
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # Mounting into kubelet's pod directories needs CAP_SYS_ADMIN and
            # Bidirectional propagation, which requires privileged.
            privileged: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            # Same path as on the host, so a bind mount's source means the
            # same thing inside and outside the container.
            - name: state-dir
              mountPath: /var/lib/chandler
        - name: registrar
          # v2.16.0
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar@sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.chandler.dev/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.chandler.dev
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: state-dir
          hostPath:
            path: /var/lib/chandler
            type: DirectoryOrCreate
