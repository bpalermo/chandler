apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # The name pods use in their volumes; fixed, not derived from the release.
  name: config.csi.stevedore.dev
  labels:
    {{- include "stevedore.labels" . | nindent 4 }}
spec:
  # Inline volumes only: nothing to attach, nothing to provision.
  attachRequired: false
  volumeLifecycleModes:
    - Ephemeral
  # The driver needs the pod's identity to subscribe on its behalf.
  podInfoOnMount: true
  # And proof of it: a token for the pod's service account that only the
  # config server accepts, which kubelet renews by publishing the volume
  # again before it expires.
  tokenRequests:
    - audience: {{ .Values.server.podIdentity.audience }}
  requiresRepublish: true
  # Files are read-only and owned by the driver; kubelet must not chown them.
  fsGroupPolicy: None
