# Overrides the name used for the chart's resources (default: the chart name).
nameOverride: ""

# Pull secrets added to every pod of the chart.
imagePullSecrets: []

# Mutual TLS between the CSI driver, the config server and the providers. Each
# side presents a certificate, and a peer is accepted by the identity in it:
# only drivers may subscribe, only config servers may watch a provider or sync
# with each other.
tls:
  # generated  The chart creates a private certificate authority and one
  #            certificate per component, in Secrets it keeps across upgrades.
  #            A certificate close to expiring is replaced by the next
  #            `helm upgrade` (see generated, below), and the components pick
  #            the new one up without restarting. Nothing renews them between
  #            upgrades, and the authority, valid for ten years, is never
  #            renewed: for hands-off rotation use "existing" or "spiffe".
  # existing   You provide the Secrets, each with tls.crt, tls.key and ca.crt,
  #            for example from cert-manager. Files are re-read when they
  #            change, so rotation needs no restart.
  # spiffe     Each component gets its identity from a SPIFFE Workload API,
  #            such as a SPIRE agent. Nothing to issue or rotate here; set
  #            the volume below and the SPIFFE ID of every component under
  #            identities.
  # disabled   No TLS: nothing is encrypted and nobody is authenticated.
  mode: generated

  # With mode "generated": how long a component's certificate is valid, and
  # how close to its expiry an upgrade replaces it. With these defaults, any
  # upgrade in a certificate's last year renews it.
  generated:
    validityDays: 1825
    renewBeforeDays: 365

  # With mode "spiffe": where the Workload API socket is.
  spiffe:
    # The volume holding the socket, as a Kubernetes volume source. With a
    # SPIRE agent that shares its socket on the node:
    #   volume:
    #     hostPath:
    #       path: /run/spire/agent-sockets
    #       type: Directory
    # or with the SPIFFE CSI driver:
    #   volume:
    #     csi:
    #       driver: csi.spiffe.io
    #       readOnly: true
    volume: {}
    # The socket's file name in that volume.
    socket: spire-agent.sock

  # With mode "existing": the Secret of each component the chart deploys.
  existingSecrets:
    csi: ""
    server: ""
    providerFile: ""
    providerS3: ""

  # The identity each component's certificate carries: a DNS name or a URI
  # among its subject alternative names. Defaults to
  # <chart name>-<component>.<namespace>.svc, which is what the generated
  # certificates carry. Set these when your own certificates carry other
  # names, such as SPIFFE IDs.
  identities:
    csi: ""
    server: ""
    providerFile: ""
    providerS3: ""

# Metrics, pushed over OTLP to an OpenTelemetry collector.
telemetry:
  # The collector's OTLP gRPC endpoint, e.g.
  # http://otel-collector.observability.svc:4317 (http:// for plaintext,
  # https:// for TLS). Empty sends nothing and dials nothing.
  otlpEndpoint: ""
  # How often metrics are sent, in seconds.
  exportIntervalSeconds: 60
  # Attributes added to every metric's resource, e.g. the cluster's name:
  #   resourceAttributes:
  #     k8s.cluster.name: prod-eu
  resourceAttributes: {}

# Every image of the chart is set the same way:
#
#   repository  Substituted at package time from the component's image_push
#               target, which takes it from bazel/registry.bzl: the registry
#               is spelled out in one place.
#   tag         Defaults to the chart's appVersion. Ignored when digest is set.
#   digest      Substituted at package time with the digest of the image index
#               the push target publishes, so a published chart can only
#               reference the images built from the same commit. Takes
#               precedence over tag. A chart you build yourself pins the image
#               YOUR build produces, which exists nowhere until it is pushed:
#               install it with `--set <component>.image.digest=` (empty) to
#               use `tag` instead, as e2e/run.sh does.

# The config server. CSI drivers subscribe to it, and it watches the providers.
server:
  image:
    repository: "{@//server:image_push.repository}"
    tag: ""
    digest: "{@//server:image_push.digest}"
    pullPolicy: IfNotPresent

  # Each replica watches the providers itself and serves the drivers connected
  # to it. Replicas copy each other's cache, which is how it survives a pod
  # being replaced without a persistent volume: run at least two.
  replicas: 2

  peerSync:
    # How often a replica syncs its cache with one other.
    interval: 30s
    # The longest a starting replica stays unready while it copies the cache
    # of the ready ones.
    warmUp: 60s

  # The gRPC port drivers connect to.
  port: 9000

  # How long a driver's connection lives before the server closes it. The
  # driver reconnects at once, through the Service, so over time drivers
  # spread across replicas, including ones added later. Pods keep their files
  # meanwhile. 0 never closes a connection.
  maxConnectionAge: 30m

  # Providers that run outside this chart, each as
  #   - name: s3          # the scheme of the URIs it serves; lowercase
  #     target: host:port # gRPC target of its ConfigProvider service
  #     identity: ...     # what its certificate carries; default: the host
  # The file provider below registers itself when enabled.
  providers: []

  # How the server knows which pod a subscription is for. kubelet gives the
  # driver a token for the pod's service account, and the server verifies it
  # against the cluster's public signing keys.
  podIdentity:
    # false believes whatever a driver says about the pod.
    verify: true
    # The audience of the token. It is requested for this audience only, so
    # the token a pod can read from its own filesystem is of no use here.
    audience: stevedore
    # Where the cluster's signing keys are: a URL or a file in the container.
    # Empty reads them from the API server, with the server's service
    # account; that needs the system:service-account-issuer-discovery role,
    # which clusters grant to every service account by default.
    keys: ""

  # The cache of what the providers emitted. It lives on an emptyDir: it
  # survives a container restart, and is refilled from the providers after the
  # pod is replaced.
  cache:
    # The emptyDir's size limit. Keep it above maxBytesPerProvider times the
    # number of providers.
    sizeLimit: 2Gi
    # How long an entry no pod uses is kept, so that pods can start through a
    # provider outage. It goes sooner if its room is needed: see the quotas.
    grace: 24h
    # The most cache keys and bytes of content held for one provider. To stay
    # within them the server evicts entries no pod uses, least recently used
    # first. What pods use is never evicted: when that alone reaches a quota,
    # new configuration is refused (RESOURCE_EXHAUSTED) and the pods asking
    # for it do not start.
    maxKeysPerProvider: 10000
    maxBytesPerProvider: 1073741824
    # The same for single providers, by name; either may be left out.
    #   providerQuotas:
    #     s3:
    #       maxKeys: 50000
    #       maxBytes: 4294967296
    providerQuotas: {}
    # How long a not-found or permission-denied answer from a provider is
    # remembered, so a crash-looping pod does not hammer it.
    negativeTtl: 30s

  # Limits on what a provider may emit for one URI. A bundle travels in one
  # gRPC message, so maxBundleBytes cannot exceed 3145728.
  maxBundleBytes: 1048576
  maxBundleFiles: 256

  nodeSelector: {}
  tolerations: []
  resources: {}
  podAnnotations: {}

providers:
  # The file provider serves the files of one pod volume: a ConfigMap, or any
  # other volume something keeps up to date. <name>:///app.yaml is the file
  # app.yaml at the root of the volume; <name>:///flags/ is a directory.
  #
  # It has no way to validate what it serves. Whoever writes the volume is
  # responsible for its content.
  file:
    enabled: false

    image:
      repository: "{@//providers/file:image_push.repository}"
      tag: ""
      digest: "{@//providers/file:image_push.digest}"
      pullPolicy: IfNotPresent

    # The scheme pods use for this provider's URIs.
    name: file

    # The volume to serve, as a Kubernetes volume source. Required when the
    # provider is enabled. For example:
    #   source:
    #     configMap:
    #       name: app-config
    source: {}

    # How often watched files are re-read. A change to a mounted ConfigMap
    # also has to reach the pod first, which kubelet does about once a minute.
    pollInterval: 2s

    # How new versions are released over time. Each rule gives a ramp to the
    # resources whose path matches a pattern ("*" matches within one path
    # segment); a rule with no match applies to every resource; the first
    # match wins. A ramp is a list of <share>:<hold>, after which the version
    # goes to every pod. Without a matching rule a version goes to every pod
    # at once.
    #   rollouts:
    #     - match: "/payments/*"
    #       ramp: "1%:5m,10%:10m,50%:10m"
    #     - ramp: "50%:1m"
    rollouts: []
    # Pods that may refuse a version, or whose application may reject it,
    # before its rollout is held where it is. Negative never holds.
    rolloutMaxRefused: 0
    # Applications that may be late to report on a version (volumes with
    # appAckTimeout) before its rollout is held. Negative never holds.
    rolloutMaxOverdue: 5

    port: 9100

    nodeSelector: {}
    tolerations: []
    resources: {}
    podAnnotations: {}

  # The S3 provider serves objects from S3 buckets: <name>://<bucket>/<key> is
  # one object, <name>://<bucket>/<prefix>/ every object below a prefix.
  #
  # It is a reference implementation. It only reads, so whoever writes to the
  # bucket is responsible for the validity of what is there.
  s3:
    enabled: false

    image:
      repository: "{@//providers/s3:image_push.repository}"
      tag: ""
      digest: "{@//providers/s3:image_push.digest}"
      pullPolicy: IfNotPresent

    # The scheme pods use for this provider's URIs. Two buckets with different
    # credentials are two releases of the provider under two names.
    name: s3

    # The buckets URIs may name. Empty allows any bucket the credentials can
    # read, which lets every pod read all of them; list the buckets.
    buckets: []

    # The AWS region. Required unless the environment provides one.
    region: ""

    # For an S3-compatible store: its endpoint, and whether buckets are
    # addressed as <endpoint>/<bucket> rather than <bucket>.<endpoint>.
    endpointUrl: ""
    pathStyle: false

    # How often watched objects are checked for change.
    pollInterval: 30s

    # How new versions are released over time. Each rule gives a ramp to the
    # resources whose <bucket>/<key> matches a pattern ("*" matches within one path
    # segment); a rule with no match applies to every resource; the first
    # match wins. A ramp is a list of <share>:<hold>, after which the version
    # goes to every pod. Without a matching rule a version goes to every pod
    # at once.
    #   rollouts:
    #     - match: "acme-config/payments/*"
    #       ramp: "1%:5m,10%:10m,50%:10m"
    #     - ramp: "50%:1m"
    rollouts: []
    # Pods that may refuse a version, or whose application may reject it,
    # before its rollout is held where it is. Negative never holds.
    rolloutMaxRefused: 0
    rolloutMaxOverdue: 5
    # A single object can also carry its own ramp in its metadata
    # (stevedore-rollout), and be held at a share (stevedore-rollout-hold: "10").

    port: 9100

    # Credentials come from the AWS SDK's default chain. With IAM roles for
    # service accounts, annotate the service account with the role:
    #   serviceAccount:
    #     annotations:
    #       eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/stevedore-s3
    serviceAccount:
      create: true
      # Defaults to <release name>-provider-s3.
      name: ""
      annotations: {}

    # Extra environment variables, e.g. static credentials from a Secret:
    #   env:
    #     - name: AWS_ACCESS_KEY_ID
    #       valueFrom: {secretKeyRef: {name: s3-credentials, key: access-key-id}}
    env: []

    # Extra containers for the provider's pod.
    extraContainers: []

    nodeSelector: {}
    tolerations: []
    resources: {}
    podAnnotations: {}

# The CSI node driver, one pod per node.
csi:
  image:
    repository: "{@//csi:image_push.repository}"
    tag: ""
    digest: "{@//csi:image_push.digest}"
    pullPolicy: IfNotPresent

  # The sidecar that registers the driver's socket with kubelet.
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.16.0
      digest: sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70
      pullPolicy: IfNotPresent
    resources: {}

  # Record a Kubernetes event on a pod when its configuration is refused,
  # rejected by the application, late to be reported on, stale, or served from
  # the node's cache, so that `kubectl describe pod` says what happened. This
  # is the driver's only use of the Kubernetes API, and needs one cluster-wide
  # permission: creating events. false gives the driver no API access at all.
  podEvents: true

  # kubelet's root directory on the nodes. /var/lib/kubelet on most
  # distributions; some (k0s, MicroK8s, ...) use another path.
  kubeletDir: /var/lib/kubelet

  # Volumes with `medium: Memory` are held in memory that is charged to the
  # driver's container, up to 6 MiB per source in the worst case. A memory
  # limit under `resources` has to leave room for them.

  # Where the driver keeps volumes and its cache on each node. It is mounted
  # into the driver at the same path.
  stateDir: /var/lib/stevedore

  priorityClassName: system-node-critical

  # Config must be mountable on every node pods can run on.
  tolerations:
    - operator: Exists

  nodeSelector: {}
  resources: {}
  podAnnotations: {}
