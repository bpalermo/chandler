# Every non-default knob the chart has, so a template test renders the paths
# the defaults leave out.
nameOverride: custom
imagePullSecrets:
  - name: registry-credentials
csi:
  image:
    repository: registry.example.com/chandler/csi
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    pullPolicy: Always
  kubeletDir: /var/lib/k0s/kubelet
  stateDir: /var/lib/chandler-state
  nodeSelector:
    kubernetes.io/os: linux
    node-role.example.com/storage: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  registrar:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
server:
  image:
    repository: registry.example.com/chandler/server
    digest: ""
    tag: v9.9.9
  replicas: 3
  cache:
    sizeLimit: 512Mi
    grace: 1h
    negativeTtl: 5s
  port: 9443
  providers:
    - name: s3
      target: provider-s3.config.svc:9100
  maxBundleBytes: 3145728
  maxBundleFiles: 1024
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: dedicated
      operator: Exists
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  podAnnotations:
    example.com/scrape: "true"
providers:
  file:
    enabled: true
    name: cm
    source:
      configMap:
        name: app-config
    pollInterval: 500ms
    port: 9101
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: dedicated
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    podAnnotations:
      example.com/scrape: "true"
  s3:
    enabled: true
    name: s3-prod
    buckets:
      - acme-config
      - acme-shared
    region: eu-west-1
    endpointUrl: http://localhost:4566
    pathStyle: true
    pollInterval: 5s
    port: 9102
    serviceAccount:
      name: s3-reader
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/chandler-s3
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: s3-credentials
            key: access-key-id
    extraContainers:
      - name: sidecar
        image: registry.example.com/sidecar:1
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: dedicated
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    podAnnotations:
      example.com/scrape: "true"
