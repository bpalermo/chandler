syntax = "proto3";

package chandler.v1;

import "chandler/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/bpalermo/chandler/api/chandler/v1;chandlerv1";

// PeerSync is spoken between config server replicas of one cluster. It lets a
// replica copy cache contents it lacks from a replica that has them, so the
// server cache survives the loss of any single replica without persistent
// storage.
//
// It is used in three situations: warm-up before a starting replica reports
// ready, periodic anti-entropy between running replicas, and on-demand fetch
// of a version named by a ConfigRollout that the replica does not hold.
service PeerSync {
  // Streams the caller every key the peer holds. The cache is small by
  // construction (bounded keys, three versions per key), so a full listing is
  // cheap and there is no incremental variant.
  rpc ListKeys(ListKeysRequest) returns (stream KeyEntry);

  // Returns the bundle with the given version, or NOT_FOUND. The caller
  // verifies the content against the version digest before storing it.
  rpc GetBundle(GetBundleRequest) returns (GetBundleResponse);
}

message ListKeysRequest {
  string server_id = 1;
}

message KeyEntry {
  // Provider name and provider-issued cache key; together the key's identity.
  string provider = 1;
  string cache_key = 2;

  // The newest version the peer has ACKed from the provider for this key.
  // Which version is stable or candidate during a rollout is not carried
  // here: that comes from the ConfigRollout object.
  string current_version = 3;

  // Every version the peer holds bytes for (at most three).
  repeated KeyVersion versions = 4;

  // URIs known to resolve to this key.
  repeated Alias aliases = 5;

  CacheControl cache_control = 6;

  // When current_version was last confirmed against the provider, by this
  // peer or by the peer it was copied from. A replica without a live watch
  // for the key adopts the entry with the newest value.
  google.protobuf.Timestamp last_refreshed = 7;

  // When any replica last had a subscription for the key. Replicas merge by
  // taking the maximum and evict on the same grace period, so an evicted key
  // is not resurrected by a peer.
  google.protobuf.Timestamp last_referenced = 8;

  // The resource was deleted at the origin and is retained from cache.
  bool orphaned = 9;
}

message KeyVersion {
  // Content address, "sha256:<hex>".
  string version = 1;
  // The provider revision this version was received under.
  string revision = 2;
}

message Alias {
  // Canonical URI.
  string uri = 1;
  // Values of the provider's vary_on attributes.
  map<string, string> attributes = 2;
}

message GetBundleRequest {
  string version = 1;
}

message GetBundleResponse {
  Bundle bundle = 1;
}
